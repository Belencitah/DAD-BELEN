server:
  port: 9090

eureka:
  client:
    serviceUrl:
      #defaultZone: http://localhost:8090/eureka
      defaultZone: ${EUREKA_URI:http://localhost:8090/eureka}
  instance:
    #hostname: localhost
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}

spring:
  application:
    name: ms-gateway-server

  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
            - id: ms-catalogo
              uri: lb://ms-catalogo
              predicates:
                - Path=/categoria/**
              filters:
                - AuthFilter
              # Si tu servicio real no expone /categoria/...:
              # filters:
              #   - StripPrefix=1
            - id: ms-clientes
              uri: lb://ms-clientes
              predicates:
                - Path=/clientes/**
              filters:
                - AuthFilter
            - id: ms-pagos
              uri: lb://ms-pagos
              predicates:
                - Path=/payments/**
              filters:
                - AuthFilter

            - id: ms-ventas
              uri: lb://ms-ventas
              predicates:
                - Path=/sales/**
              filters:
                - AuthFilter
            - id: ms-producto
              uri: lb://ms-producto
              predicates:
                - Path=/producto/**
              filters:
                - AuthFilter
            - id: ms-auth
              uri: lb://ms-auth
              predicates:
                - Path=/auth/**
              filters:
                - AuthFilter